name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Clona todo el historial

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          ssh-keyscan -H 148.113.175.43 >> ~/.ssh/known_hosts

      - name: Add Git remote
        run: |
          git remote add despliegue ssh://despliegue@148.113.175.43/var/repos/test.git

      - name: Push to VPS
        run: |
          git push -f despliegue master:master
